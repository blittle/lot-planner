<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>Lot Planner</h1>
    <div class="topbar-actions">
      <span id="stats" class="stats"></span>
      <button id="clearAllBtn" class="btn btn-danger" title="Remove all placed plants">Clear placed</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap">
      <div id="viewport" class="viewport">
        <div id="stage" class="stage">
          <img id="lotImage" src="141.79ft.jpg" alt="Property top-down view" draggable="false">
          <div id="shapes" class="shapes"></div>
          <div id="markers" class="markers"></div>
          <svg id="rulerLayer" class="ruler-layer" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line id="rulerLine" class="ruler-line" x1="0" y1="0" x2="0" y2="0"></line>
          </svg>
          <div id="rulerDotStart" class="ruler-dot"></div>
          <div id="rulerDotEnd" class="ruler-dot"></div>
          <div id="rulerLabel" class="ruler-label"></div>
        </div>
        <div class="zoom-controls">
          <button id="rulerBtn" class="zoom-btn zoom-btn-wide" title="Measure distances">Ruler</button>
          <button id="zoomInBtn" class="zoom-btn" title="Zoom in">+</button>
          <span id="zoomLevel" class="zoom-level">100%</span>
          <button id="zoomOutBtn" class="zoom-btn" title="Zoom out">&minus;</button>
          <button id="zoomResetBtn" class="zoom-btn zoom-btn-wide" title="Reset view">Reset</button>
        </div>
      </div>
      <p class="hint">Drag a plant from the "Not Placed" list onto the map. Drag a marker to reposition it, or the background to pan. Scroll to zoom. Click a marker to select/remove it. Toggle Ruler, then click and drag on the map to measure a distance.</p>
    </section>

    <aside class="sidebar">
      <div class="tabs">
        <button class="tab-btn" data-tab="all">All</button>
        <button class="tab-btn active" data-tab="unplaced">Not Placed</button>
        <button class="tab-btn" data-tab="placed">Placed</button>
        <button class="tab-btn" data-tab="shapes">Shapes</button>
      </div>

      <input type="text" id="filterInput" class="filter-input" placeholder="Filter by name, category, color...">

      <div class="tab-panel" id="panel-all">
        <div id="allList" class="plant-list"></div>
      </div>

      <div class="tab-panel active" id="panel-unplaced">
        <div id="unplacedList" class="plant-list"></div>
      </div>

      <div class="tab-panel" id="panel-placed">
        <div id="placedList" class="plant-list"></div>
      </div>

      <div class="tab-panel" id="panel-shapes">
        <div class="shape-form">
          <div class="shape-form-row">
            <select id="shapeTypeInput" class="shape-select">
              <option value="circle">Circle</option>
              <option value="rectangle">Rectangle</option>
            </select>
            <input type="color" id="shapeColorInput" class="shape-color" value="#2b6fd1" title="Shape color">
            <label class="shape-field shape-opacity-field">Opacity (%)
              <input type="number" id="shapeOpacityInput" min="0" max="100" step="5" value="100">
            </label>
          </div>
          <div class="shape-form-row" id="circleFields">
            <label class="shape-field">Diameter (ft)
              <input type="number" id="shapeDiameterInput" min="0.5" step="0.5" value="6">
            </label>
          </div>
          <div class="shape-form-row" id="rectFields" style="display:none">
            <label class="shape-field">Width (ft)
              <input type="number" id="shapeWidthInput" min="0.5" step="0.5" value="6">
            </label>
            <label class="shape-field">Height (ft)
              <input type="number" id="shapeHeightInput" min="0.5" step="0.5" value="4">
            </label>
          </div>
          <button id="addShapeBtn" class="btn btn-primary">Add to map</button>
        </div>
        <div id="shapeListEl" class="plant-list"></div>
      </div>
    </aside>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
